services:
  server:
    build: ./server
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/app/uploads
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:5000
    ports:
      - '8080:80'
    depends_on:
      - server
    restart: unless-stopped
